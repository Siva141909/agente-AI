version: "3.9"

services:
  backend:
    build:
      context: ./backend_spare
    ports:
      - "8000:8000"
    env_file:
      - ./backend_spare/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

name: Deploy Backend → Render

# Render auto-deploys via GitHub integration on push to main (see render.yaml).
# This workflow only runs checks; actual deploy is handled by Render.

on:
  push:
    branches: [main]
    paths:
      - "backend_spare/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify backend files exist
        run: |
          test -f backend_spare/main.py && echo "main.py OK"
          test -f backend_spare/requirements.txt && echo "requirements.txt OK"
          test -f backend_spare/Dockerfile && echo "Dockerfile OK"

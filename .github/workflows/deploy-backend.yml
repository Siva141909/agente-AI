name: Deploy Backend → Railway

on:
  push:
    branches: [main]
    paths:
      - "backend_spare/**"
      - "railway.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Railway environment variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          railway variables set \
            SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            ALLOWED_ORIGINS="${{ secrets.VITE_VERCEL_URL }}" \
            --service backend \
            --project ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: railway up --service backend --detach --project ${{ secrets.RAILWAY_PROJECT_ID }}
